# 微信皮肤（配色取自微信键盘）
# 明：https://gist.github.com/zsakvo/fff6e4859265d5d629439d5ccb553f8a
# 暗：https://gist.github.com/shlroland/78b3af88b993116c6f3e14b30cfefac0
# 默认：竖排候选 + 微信（明）；系统深色模式自动切换 微信·暗
patch:
  preset_color_schemes:
    wechat:
      name: "微信"
      author: zsakvo
      back_color: 0xFFFFFF
      border_height: 0
      border_width: 8
      candidate_format: "%c %@ "
      comment_text_color: 0x999999
      corner_radius: 5
      hilited_corner_radius: 5
      font_face: PingFangSC
      font_point: 16
      hilited_candidate_back_color: 0x75B100
      hilited_candidate_text_color: 0xFFFFFF
      candidate_list_layout: stacked
      inline_preedit: true
      label_font_point: 12
      text_color: 0x424242
      spacing: 12
      hilite_spacing: 6
      line_spacing: 8
    wechat_dark:
      name: "微信·暗"
      author: shlroland
      back_color: 0x151515
      border_color: 0x151515
      border_height: 0
      border_width: 8
      candidate_format: "%c %@ "
      comment_text_color: 0xAEAEAE
      corner_radius: 5
      hilited_corner_radius: 5
      font_face: PingFangSC
      font_point: 16
      hilited_candidate_back_color: 0x75B100
      hilited_candidate_text_color: 0xFFFFFF
      candidate_list_layout: stacked
      inline_preedit: true
      label_font_point: 12
      label_color: 0x777777
      text_color: 0xBBBBBB
      spacing: 12
      hilite_spacing: 6
      line_spacing: 8

  style:
    inline_preedit: true
    inline_candidate: false
    translucency: true
    color_scheme: wechat
    color_scheme_dark: wechat_dark
    font_face: PingFangSC
    font_point: 16
    corner_radius: 5
    line_spacing: 8
    hilite_spacing: 6
    spacing: 12
    text_orientation: horizontal
    label_font_point: 12
    candidate_list_layout: stacked
    hilited_corner_radius: 5
